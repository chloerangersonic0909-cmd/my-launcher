name: Android CI

permissions:
  contents: write

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:
    inputs:
      test_webhook:
        description: "ส่งข้อความทดสอบ Discord Webhook โดยไม่ Build APK"
        required: false
        type: boolean
        default: false

jobs:
  test-discord-webhook:
    if: github.event_name == 'workflow_dispatch' && inputs.test_webhook
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is missing."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          webhook_url = os.environ["DISCORD_WEBHOOK_URL"].strip()
          parsed = urllib.parse.urlsplit(webhook_url)
          if parsed.scheme != "https" or parsed.hostname not in ("discord.com", "discordapp.com") or not re.fullmatch(r"/api/webhooks/[0-9]+/[A-Za-z0-9._-]+/?", parsed.path):
              raise SystemExit("DISCORD_WEBHOOK_URL format is invalid. Copy the full Webhook URL from Discord Integrations.")
          payload = {
              "username": "My Launcher Test",
              "embeds": [{
                  "title": "🧪 My Launcher — ทดสอบ Webhook",
                  "description": "ข้อความทดสอบ ระบบแจ้งเตือน Discord Webhook เชื่อมต่อและทำงานได้แล้ว",
                  "color": 3447003,
                  "fields": [
                      {"name": "สถานะ", "value": "✅ สำเร็จ", "inline": True},
                      {"name": "ประเภท", "value": "ทดสอบ", "inline": True}
                  ],
                  "footer": {"text": "My Launcher • Webhook Test"}
              }]
          }
          request = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "MyLauncher-GitHubActions/1.0"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Discord webhook test status:", response.status)
                  if response.status not in (200, 204):
                      raise SystemExit("Discord returned an unexpected HTTP status.")
          except urllib.error.HTTPError as error:
              body = error.read(1000).decode("utf-8", errors="replace")
              print("Discord rejected the webhook request.")
              print("HTTP status:", error.code)
              print("Discord response:", body or "(empty response)")
              raise SystemExit("Webhook test failed. Use the Discord response above to identify the cause.")
          except urllib.error.URLError as error:
              print("Could not reach Discord:", getattr(error, "reason", "network error"))
              raise SystemExit("Webhook test failed because Discord could not be reached.")
          PY

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.test_webhook != true
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out

      # Build and publish the debug APK first so release signing cannot block it.
      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*

      # Release signing may require repository secrets; it must not block the debug APK.
      - name: Build Release .apk
        id: release
        continue-on-error: true
        run: |
          gradle :app_pojavlauncher:assembleRelease
          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/app-release.apk
          md5sum out/app-release.apk > out/app-release.md5

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release.*

      - name: Publish APK to GitHub Release
        if: steps.release.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: My Launcher ${{ github.ref_name }}
          body: "My Launcher รุ่น ${{ github.ref_name }} พร้อมดาวน์โหลด"
          files: out/app-release.apk

      # Notify the same Discord channel whenever a debug APK build succeeds.
      - name: Notify Discord about successful APK build
        if: success() && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCH_NAME: ${{ github.ref_name }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is missing; Discord notification skipped."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          webhook = os.environ["DISCORD_WEBHOOK_URL"].strip()
          parsed = urllib.parse.urlsplit(webhook)
          if parsed.scheme != "https" or parsed.hostname not in ("discord.com", "discordapp.com") or not re.fullmatch(r"/api/webhooks/[0-9]+/[A-Za-z0-9._-]+/?", parsed.path):
              raise SystemExit("DISCORD_WEBHOOK_URL format is invalid.")
          payload = {
              "username": "My Launcher Updates",
              "embeds": [{
                  "title": "🔔 My Launcher — APK Build สำเร็จ",
                  "description": "มีไฟล์ APK รุ่นทดสอบใหม่พร้อมดาวน์โหลดจาก GitHub Actions",
                  "color": 5763719,
                  "fields": [
                      {"name": "Branch", "value": os.environ["BRANCH_NAME"], "inline": True},
                      {"name": "สถานะ", "value": "✅ Build สำเร็จ", "inline": True},
                      {"name": "ดาวน์โหลด APK", "value": f"[เปิดหน้า Artifacts / ดาวน์โหลด APK]({os.environ['BUILD_URL']})", "inline": False}
                  ],
                  "footer": {"text": "My Launcher • Android"}
              }]
          }
          request = urllib.request.Request(webhook, data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "MyLauncher-GitHubActions/1.0"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Discord webhook status:", response.status)
          except urllib.error.HTTPError as error:
              print("Discord webhook rejected request; HTTP", error.code)
              print(error.read(500).decode("utf-8", errors="replace"))
              raise SystemExit("Discord notification failed.")
          PY
